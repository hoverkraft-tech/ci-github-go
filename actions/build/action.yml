---
name: Build Go
description: |
  Compile Go packages without rewriting module metadata.

  The default is `go build -mod=readonly -trimpath ./...`. Use `command` to build
  a project binary, for example `go build -mod=readonly -trimpath -o dist/server ./cmd/server`.
  Commands are trusted Bash programs; failures fail the action. This action leaves
  outputs in the project directory. Use the reusable workflow's `build.artifact`
  option or an upload step to retain them. It does not publish releases.

  Run [setup-go](../setup-go/README.md) first with the same `working-directory`.

  See the [continuous integration workflow](../../.github/workflows/continuous-integration.md) for orchestration and version matrices.
author: hoverkraft
branding:
  icon: package
  color: blue
inputs:
  working-directory:
    description: Go module directory.
    default: .
  command:
    description: Trusted Bash build command. Artifact upload belongs to the caller or continuous-integration workflow.
    default: go build -mod=readonly -trimpath ./...
runs:
  using: composite
  steps:
    - id: directory
      uses: hoverkraft-tech/ci-github-common/actions/working-directory@66882b24f9f13e45a6541896a5a7c638cb91c94c
      with:
        working-directory: ${{ inputs.working-directory }}
    - id: run
      shell: bash
      working-directory: ${{ steps.directory.outputs.absolute-path }}
      env:
        COMMAND: ${{ inputs.command }}
        CI: "true"
      run: |
        test -n "$COMMAND" || { echo "command must not be empty." >&2; exit 1; }
        if [ -n "$COMMAND" ] && ! [[ "$COMMAND" =~ [^[:space:]] ]]; then
          echo "command must not contain only whitespace." >&2
          exit 1
        fi
        bash --noprofile --norc -e -u -o pipefail -c "$COMMAND"
