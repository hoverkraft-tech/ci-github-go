---
name: Setup Go
description: |
  Install the project toolchain, cache modules and verify dependencies.

  Each invocation targets one module with a committed `go.mod` and `go.sum`
  when dependencies require it. Explicit `go-version` takes precedence;
  otherwise setup uses `go.mod`, including its `toolchain` directive.
  Pin a supported toolchain in the project. Explicit major/minor versions receive
  their latest patch releases.

  Setup runs `go mod download`, `go mod verify` and `go mod tidy -diff`.
  Metadata drift fails without rewriting files. `GOWORK=off` isolates the module
  and `GOTOOLCHAIN=local` prevents a matrix entry silently switching compilers.
  Use a caller matrix over `working-directory` for repositories with several modules.
  Set `install-dependencies: "false"` for runtime-only jobs or caller-managed dependencies;
  `go.mod` is still required. Working directories must stay inside the checkout.

  ### Standalone setup

  Check out the project before setup. Use a Linux runner supporting Node.js 24
  actions and pin all actions from this repository to the same reviewed commit.
  Later lint, test and audit actions reuse this environment.

  ```yaml
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: hoverkraft-tech/ci-github-go/actions/setup-go@main
      with:
        working-directory: .
  ```

  <!-- jscpd:ignore-start -->
  <!-- Shared setup and reporting guidance for standalone actions. -->

  See the [continuous integration workflow](../../.github/workflows/continuous-integration.md) for orchestration and version matrices.

  <!-- jscpd:ignore-end -->
author: hoverkraft
branding:
  icon: package
  color: blue
inputs:
  working-directory:
    description: Go module directory inside the checkout.
    default: .
  go-version:
    description: Explicit Go version. Empty reads the go directive in this module's go.mod.
    default: ""
  install-dependencies:
    description: Download and verify module dependencies. Disable for tooling-only jobs.
    default: "true"
outputs:
  go-version:
    description: Installed Go version.
    value: ${{ steps.go.outputs.go-version }}
runs:
  using: composite
  steps:
    - id: directory
      uses: hoverkraft-tech/ci-github-common/actions/working-directory@d606f77fad305ef07dfde3db5270f5e324019c97
      with:
        working-directory: ${{ inputs.working-directory }}
    - id: validate
      shell: bash
      working-directory: ${{ steps.directory.outputs.absolute-path }}
      env:
        INSTALL_DEPENDENCIES: ${{ inputs.install-dependencies }}
      run: |
        case "$INSTALL_DEPENDENCIES" in
          true|false) ;;
          *) echo 'install-dependencies must be true or false.' >&2; exit 1 ;;
        esac
        test -f go.mod || { echo 'Missing go.mod in working-directory.' >&2; exit 1; }
    - id: go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
      with:
        go-version: ${{ inputs.go-version }}
        go-version-file: ${{ steps.directory.outputs.workspace-relative-path }}/go.mod
        cache: ${{ inputs.install-dependencies == 'true' }}
        cache-dependency-path: |
          ${{ steps.directory.outputs.workspace-relative-path }}/go.sum
          ${{ steps.directory.outputs.workspace-relative-path }}/go.mod
    - id: environment
      shell: bash
      run: |
        # Keep a matrix entry on the requested toolchain and module.
        printf '%s\n' 'GOTOOLCHAIN=local' 'GOWORK=off' >> "$GITHUB_ENV"
    - id: install
      shell: bash
      if: inputs.install-dependencies == 'true'
      working-directory: ${{ steps.directory.outputs.absolute-path }}
      env:
        GOTOOLCHAIN: local
        GOWORK: "off"
      run: |
        go mod download
        go mod verify
        go mod tidy -diff
