---
name: Lint Go
description: |
  Check gofmt, module tidiness and golangci-lint v2 diagnostics.

  Put project rules in `.golangci.yml`; the default is the standard linter set.
  The pinned golangci-lint release must support the selected Go version.
  Use `command` to replace defaults with a trusted Bash program.
  Custom commands should emit SARIF or Checkstyle for annotations.

  <!-- jscpd:ignore-start -->
  <!-- Shared setup and reporting guidance for standalone actions. -->

  Run [setup-go](../setup-go/README.md) first with the same `working-directory`.

  Native reports survive command failures and are retained for seven days.
  See the [continuous integration workflow](../../.github/workflows/continuous-integration.md#reports-and-permissions) for consolidated reporting and permissions.

  <!-- jscpd:ignore-end -->
author: hoverkraft
branding:
  icon: package
  color: blue
inputs:
  working-directory:
    description: Go module directory.
    default: .
  golangci-lint-version:
    description: Pinned golangci-lint v2 release.
    default: v2.15.0
  command:
    description: Trusted Bash command replacing the default formatting and lint checks. Project configuration remains authoritative.
    default: ""
  report-plan:
    description: Expected producer metadata supplied by reusable workflows. Leave empty for a standalone invocation.
    default: ""
outputs:
  report-plan:
    description: Expected lint report metadata. Forward from standalone jobs.
    value: ${{ steps.report-plan.outputs.report-plan }}
  report-artifact-id:
    description: Native lint report bundle.
    value: ${{ steps.reports.outputs.artifact-id }}
runs:
  using: composite
  steps:
    - id: directory
      uses: hoverkraft-tech/ci-github-common/actions/working-directory@d606f77fad305ef07dfde3db5270f5e324019c97 # 4.2.4
      with:
        working-directory: ${{ inputs.working-directory }}
    - id: report-plan
      uses: hoverkraft-tech/ci-github-common/actions/quality/record-ci-reports@11c842902d003cc4ee2fa1d42f6d80bc6828461a # unified reports (PR #683, unreleased)
      with:
        operation: plan
        report-plan: ${{ inputs.report-plan }}
        producers: '[{"key":"lint","type":"lint","directory":${{ toJSON(steps.directory.outputs.workspace-relative-path || ''.'') }},"coverage":[]}]'
    - id: golangci
      if: inputs.command == ''
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: ${{ inputs.golangci-lint-version }}
        install-only: true
        working-directory: ${{ steps.directory.outputs.workspace-relative-path }}
    - id: run
      shell: bash
      working-directory: ${{ steps.directory.outputs.absolute-path }}
      env:
        COMMAND: ${{ inputs.command }}
        GOTOOLCHAIN: local
        GOWORK: "off"
      run: |
        if [ -n "$COMMAND" ] && ! [[ "$COMMAND" =~ [^[:space:]] ]]; then
          echo "command must not contain only whitespace." >&2
          exit 1
        fi
        if [ -n "$COMMAND" ]; then
          bash --noprofile --norc -e -u -o pipefail -c "$COMMAND"
          exit
        fi
        status=0
        # gofmt follows neither vendor trees nor symlinked directories.
        while IFS= read -r -d '' file; do
          if [ -n "$(gofmt -l "$file")" ]; then
            echo "Formatting required: $file" >&2
            status=1
          fi
        done < <(find . -type d \( -name vendor -o -name .git -o -name .cache \) -prune -o -type f -name '*.go' -print0)
        go mod tidy -diff || status=1
        golangci-lint run --timeout=5m --output.sarif.path=golangci-lint.sarif || status=1
        exit "$status"
    - id: reports
      name: Record lint results
      if: ${{ !cancelled() && steps.run.outcome != 'skipped' && steps.report-plan.outcome == 'success' }}
      uses: hoverkraft-tech/ci-github-common/actions/quality/record-ci-reports@11c842902d003cc4ee2fa1d42f6d80bc6828461a # unified reports (PR #683, unreleased)
      with:
        working-directory: ${{ steps.directory.outputs.absolute-path }}
        report-plan: ${{ steps.report-plan.outputs.report-plan }}
        report-paths: auto:lint
