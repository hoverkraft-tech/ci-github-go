---
name: Test Go
description: |
  Run Go tests with detailed JUnit results on every runtime and optional native coverage.

  Run setup-go first. Defaults write junit.xml and coverage.out into a fresh
  CI_REPORTS_DIR. Coverage instrumentation is disabled when coverage is false.
  Custom commands receive CI_REPORTS_DIR and CI_TEST_COVERAGE.

  Required outputs are registered before execution and validated after success or
  failure. The Go profile retains native statement counts. Select publication once
  in common ci-reports after all jobs; no report outputs need forwarding.
  Producer jobs require actions: read and contents: read.
author: hoverkraft
branding:
  icon: package
  color: blue
inputs:
  working-directory:
    description: Go module directory.
    default: .
  command:
    description: Trusted Bash replacement for the default checks. Write declared native reports under CI_REPORTS_DIR; test commands must honor CI_TEST_COVERAGE.
    default: ""
  race:
    description: Enable the race detector for the default command. Requires CGO and a C compiler.
    default: "true"
  coverage:
    description: Collect native Go coverage. The default command disables instrumentation when false.
    default: "true"
  test-results:
    description: Required native report paths relative to CI_REPORTS_DIR, one per line.
    default: junit.xml
  test-coverage:
    description: Required native Go coverage profile paths relative to CI_REPORTS_DIR when coverage is enabled.
    default: coverage.out
outputs:
  report-artifact-id:
    description: Native report bundle, including available diagnostics after failures.
    value: ${{ steps.reports.outputs.artifact-id }}
runs:
  using: composite
  steps:
    - id: directory
      uses: hoverkraft-tech/ci-github-common/actions/working-directory@d606f77fad305ef07dfde3db5270f5e324019c97 # 4.2.4
      with:
        working-directory: ${{ inputs.working-directory }}
    - id: validate
      shell: bash
      env:
        RACE: ${{ inputs.race }}
        COVERAGE: ${{ inputs.coverage }}
      run: |
        case "$RACE" in true|false) ;; *) echo 'race must be true or false.' >&2; exit 1 ;; esac
        case "$COVERAGE" in true|false) ;; *) echo 'coverage must be true or false.' >&2; exit 1 ;; esac
    - id: definition
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        DIRECTORY: ${{ steps.directory.outputs.workspace-relative-path || '.' }}
        WORKING_DIRECTORY: ${{ steps.directory.outputs.absolute-path }}
        GOTOOLCHAIN: local
        GOWORK: off
        RESULTS: ${{ inputs.test-results }}
        COVERAGE: ${{ inputs.coverage }}
        COVERAGE_PATHS: ${{ inputs.test-coverage }}
      with:
        script: |
          const paths = value => {
            const result = value.split(/\r?\n/).map(item => item.trim()).filter(Boolean);
            if (!result.length) throw new Error('Required report paths must not be empty.');
            return result;
          };
          const reports = paths(process.env.RESULTS).map(pattern => ({kind: 'test', pattern}));
          if (process.env.COVERAGE === 'true') reports.push(...paths(process.env.COVERAGE_PATHS).map(pattern => ({kind:'coverage',pattern,language:'Go'})));
          const options = {cwd:process.env.WORKING_DIRECTORY,silent:true};
          const runtime = await exec.getExecOutput('go', ['env','GOVERSION'], options);
          const modulePath = await exec.getExecOutput('go', ['list','-m','-f','{{.Path}}'], options);
          core.setOutput('definition', {name:'Go tests',project:process.env.DIRECTORY,variant:{runtime:runtime.stdout.trim()},reports,'path-mapping':{[modulePath.stdout.trim()]:process.env.DIRECTORY}});
    - id: prepare
      uses: hoverkraft-tech/ci-github-common/actions/quality/record-ci-reports@57ec4a8bf0ab9ea52beea725b5e59895ed39f4f2 # PR #683 (unreleased)
      with:
        operation: prepare
        definition: ${{ steps.definition.outputs.definition }}
    - id: run
      shell: bash
      working-directory: ${{ steps.directory.outputs.absolute-path }}
      env:
        COMMAND: ${{ inputs.command }}
        RACE: ${{ inputs.race }}
        GOTESTSUM_VERSION: v1.13.0
        GOTOOLCHAIN: local
        GOWORK: "off"
        CI: "true"
        CI_REPORTS_DIR: ${{ steps.prepare.outputs.report-directory }}
        CI_TEST_COVERAGE: ${{ inputs.coverage }}
      run: |
        if [ -n "$COMMAND" ] && ! [[ "$COMMAND" =~ [^[:space:]] ]]; then
          echo "command must not contain only whitespace." >&2
          exit 1
        fi
        if [ -n "$COMMAND" ]; then
          bash --noprofile --norc -e -u -o pipefail -c "$COMMAND"
          exit
        fi
        args=(-mod=readonly -count=1 -timeout=5m)
        if [ "$CI_TEST_COVERAGE" = true ]; then args+=(-covermode=atomic "-coverprofile=$CI_REPORTS_DIR/coverage.out"); fi
        if [ "$RACE" = true ]; then args+=(-race); fi
        go run "gotest.tools/gotestsum@$GOTESTSUM_VERSION" --junitfile="$CI_REPORTS_DIR/junit.xml" --format=testname -- "${args[@]}" ./...
    - name: Validate and retain native reports
      id: reports
      if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
      uses: hoverkraft-tech/ci-github-common/actions/quality/record-ci-reports@57ec4a8bf0ab9ea52beea725b5e59895ed39f4f2 # unified reports (PR #683, unreleased)
      with:
        operation: finalize
        recording: ${{ steps.prepare.outputs.recording }}
        outcome: ${{ steps.run.outcome }}
