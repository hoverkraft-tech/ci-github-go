---
name: Test Go
description: |
  Run Go tests and retain native test and coverage reports.

  Use the matching setup action first. Commands must generate JUnit reports.
  Coverage collection requires Cobertura XML. The test command controls instrumentation.

  Forward report-plan from standalone jobs, or use the reusable CI workflow, which
  exposes the complete expected plan automatically. Choose external coverage
  publication once in the common ci-reports workflow. This action posts no comments
  and needs no publication permissions. Available reports survive test failures.
author: hoverkraft
branding:
  icon: package
  color: blue
inputs:
  working-directory:
    description: Go module directory.
    default: .
  command:
    description: Trusted Bash command replacing the default test command. Generate junit.xml and coverage.out for reporting.
    default: ""
  race:
    description: Enable the race detector for the default command. Requires CGO and a C compiler.
    default: "true"
  coverage-reports:
    description: |-
      Optional JSON array of Cobertura file, language and label. Empty uses cobertura.xml and the project directory as its stable label.
    default: ""
  coverage:
    description: Require and collect Cobertura coverage. Set false to retain only available native diagnostics. Instrumentation is controlled by the test command.
    default: "true"
  report-plan:
    description: Expected producer metadata supplied by reusable workflows. Leave empty for a standalone invocation.
    default: ""
outputs:
  report-plan:
    description: Expected report metadata. Forward from standalone jobs.
    value: ${{ steps.report-plan.outputs.report-plan }}
  report-artifact-id:
    description: Native report bundle, including available diagnostics after failures.
    value: ${{ steps.reports.outputs.artifact-id }}
runs:
  using: composite
  steps:
    - id: directory
      uses: hoverkraft-tech/ci-github-common/actions/working-directory@d606f77fad305ef07dfde3db5270f5e324019c97 # 4.2.4
      with:
        working-directory: ${{ inputs.working-directory }}
    - id: validate
      shell: bash
      env:
        RACE: ${{ inputs.race }}
        COVERAGE: ${{ inputs.coverage }}
      run: |
        case "$RACE" in true|false) ;; *) echo 'race must be true or false.' >&2; exit 1 ;; esac
        case "$COVERAGE" in true|false) ;; *) echo 'coverage must be true or false.' >&2; exit 1 ;; esac
    - id: report-plan
      uses: hoverkraft-tech/ci-github-common/actions/quality/record-ci-reports@11c842902d003cc4ee2fa1d42f6d80bc6828461a # unified reports (PR #683, unreleased)
      with:
        operation: plan
        report-plan: ${{ inputs.report-plan }}
        producers: '[{"key":"test","type":"test","directory":${{ toJSON(steps.directory.outputs.workspace-relative-path || ''.'') }},"coverage":${{ inputs.coverage == ''true'' && (inputs.coverage-reports || ''[{"file":"cobertura.xml","language":"Go"}]'') || ''[]'' }}}]'
    - id: run
      shell: bash
      working-directory: ${{ steps.directory.outputs.absolute-path }}
      env:
        COMMAND: ${{ inputs.command }}
        RACE: ${{ inputs.race }}
        GOTESTSUM_VERSION: v1.13.0
        GOTOOLCHAIN: local
        GOWORK: "off"
        CI: "true"
      run: |
        if [ -n "$COMMAND" ] && ! [[ "$COMMAND" =~ [^[:space:]] ]]; then
          echo "command must not contain only whitespace." >&2
          exit 1
        fi
        if [ -n "$COMMAND" ]; then
          bash --noprofile --norc -e -u -o pipefail -c "$COMMAND"
          exit
        fi
        args=(-mod=readonly -count=1 -timeout=5m -covermode=atomic -coverprofile=coverage.out)
        if [ "$RACE" = true ]; then args+=(-race); fi
        go run "gotest.tools/gotestsum@$GOTESTSUM_VERSION" --junitfile=junit.xml --format=testname -- "${args[@]}" ./...
    - name: Convert native Go coverage to Cobertura
      id: cobertura
      if: ${{ !cancelled() && steps.run.outcome != 'skipped' && inputs.coverage == 'true' && inputs.coverage-reports == '' }}
      shell: bash
      working-directory: ${{ steps.directory.outputs.absolute-path }}
      env:
        GOCOVER_COBERTURA_VERSION: v1.5.0
        GOTOOLCHAIN: local
        GOWORK: "off"
      run: |
        test -s coverage.out || { echo 'Native coverage requires coverage.out.' >&2; exit 1; }
        go run "github.com/boumenot/gocover-cobertura@$GOCOVER_COBERTURA_VERSION" < coverage.out > cobertura.xml
    - name: Record test results
      id: reports
      if: ${{ !cancelled() && steps.run.outcome != 'skipped' && steps.report-plan.outcome == 'success' }}
      uses: hoverkraft-tech/ci-github-common/actions/quality/record-ci-reports@11c842902d003cc4ee2fa1d42f6d80bc6828461a # unified reports (PR #683, unreleased)
      with:
        working-directory: ${{ steps.directory.outputs.absolute-path }}
        report-plan: ${{ steps.report-plan.outputs.report-plan }}
        report-paths: auto:test
