name: Audit Go
description: |
  Run the official govulncheck against reachable dependencies and the selected Go standard library. Run setup-go first. This check requires network access to the vulnerability database.

  See the [usage guide](../../docs/usage/README.md).
author: hoverkraft
branding:
  icon: package
  color: blue
inputs:
  working-directory:
    description: Go module directory.
    default: .
runs:
  using: composite
  steps:
    # Shared working-directory validation, kept at each standalone entry point.
    # jscpd:ignore-start
    - id: directory
      uses: hoverkraft-tech/ci-github-common/actions/working-directory@d606f77fad305ef07dfde3db5270f5e324019c97
      with:
        working-directory: ${{ inputs.working-directory }}
    # jscpd:ignore-end
    - id: audit
      shell: bash
      working-directory: ${{ steps.directory.outputs.absolute-path }}
      env:
        GOVULNCHECK_VERSION: v1.10.0
        GOTOOLCHAIN: local
        GOWORK: "off"
      run: |
        go run "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION" ./...
