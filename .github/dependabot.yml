---
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /actions/**
    schedule:
      interval: weekly
      day: friday
    commit-message:
      prefix: build
      include: scope
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
  - package-ecosystem: docker
    directories:
      - /
      - /.devcontainer
    schedule:
      interval: weekly
      day: friday
    commit-message:
      prefix: build
      include: scope
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      docker-dependencies:
        patterns:
          - "*"
  - package-ecosystem: npm
    directories:
      - /
    schedule:
      interval: weekly
      day: friday
    commit-message:
      prefix: build
      include: scope
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      npm-dependencies:
        patterns:
          - "*"
  - package-ecosystem: gomod
    directories:
      - /tests/go-project
    schedule:
      interval: weekly
      day: friday
    commit-message:
      prefix: build
      include: scope
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      gomod-dependencies:
        patterns:
          - "*"
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
      day: friday
    commit-message:
      prefix: build
      include: scope
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      devcontainers-dependencies:
        patterns:
          - "*"
