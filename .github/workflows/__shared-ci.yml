name: Internal - Common Continuous Integration tasks
"on":
  workflow_call: null
permissions: {}
jobs:
  linter:
    uses: hoverkraft-tech/ci-github-common/.github/workflows/linter.yml@57ec4a8bf0ab9ea52beea725b5e59895ed39f4f2 # PR #683 (unreleased)
    permissions:
      contents: read
      statuses: write
      issues: write
      packages: read
      pull-requests: write
      actions: read
      security-events: write
    with:
      linter-env: |
        LOG_LEVEL=INFO
        GOTOOLCHAIN=local
        GO_CONFIG_FILE=../../tests/go-project/.golangci.yml
  test:
    uses: $/.github/workflows/__test-workflow-continuous-integration.yml
    permissions:
      contents: read
      id-token: write
      actions: read
  test-action-setup-go:
    uses: $/.github/workflows/__test-action-setup-go.yml
    permissions:
      contents: read
      actions: read
  test-action-lint:
    uses: $/.github/workflows/__test-action-lint.yml
    permissions:
      actions: read
      contents: read
  test-action-test:
    uses: $/.github/workflows/__test-action-test.yml
    permissions:
      actions: read
      contents: read
  test-action-audit:
    uses: $/.github/workflows/__test-action-audit.yml
    permissions:
      contents: read
      actions: read
  test-action-build:
    uses: $/.github/workflows/__test-action-build.yml
    permissions:
      contents: read
      actions: read
  reports:
    if: ${{ !cancelled() }}
    needs:
      - linter
      - test
      - test-action-setup-go
      - test-action-lint
      - test-action-test
      - test-action-audit
      - test-action-build
    uses: hoverkraft-tech/ci-github-common/.github/workflows/ci-reports.yml@57ec4a8bf0ab9ea52beea725b5e59895ed39f4f2 # PR #683 (unreleased)
    permissions:
      actions: read
      contents: read
      pull-requests: write
      code-quality: write
      id-token: write
      security-events: write
    with:
      job-results: ${{ toJSON(needs) }}
