---
name: Internal - Test test action
"on":
  workflow_call: null
permissions: {}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.failed-test.outputs.report-artifact-id }}
      success-artifact-id: ${{ steps.test.outputs.report-artifact-id }}
      coverage-artifact-id: ${{ steps.test.outputs.coverage-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        name: Arrange - Check out the repository
      - name: Assert - Action contract tests pass
        uses: hoverkraft-tech/ci-github-nodejs/actions/test@98d91b1cc347efc64cd5fb20bc0ebc076acad114 # 3.1.0
        with:
          command: test:ci
          arguments: '["actions/test/action.test.cjs"]'
          coverage: ""
          comment: "false"
      - uses: $/actions/setup-go
        with:
          working-directory: tests/go-project
        name: Arrange - Install dependencies
      - id: test
        uses: $/actions/test
        with:
          working-directory: tests/go-project
        name: Act - Run default tests
      - id: failed-test
        continue-on-error: true
        uses: $/actions/test
        with:
          working-directory: tests/go-project
          command: |-
            printf '%s' '<testsuites tests="1" failures="1"><testsuite name="failure" tests="1" failures="1"><testcase name="fails"><failure message="expected">failure</failure></testcase></testsuite></testsuites>' > junit.xml
            exit 17
          coverage: ""
        name: Act - Run a failing test command
      - name: Assert failures and reports
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SUCCESS_ARTIFACT: ${{ steps.test.outputs.report-artifact-id }}
          FAILURE_ARTIFACT: ${{ steps.failed-test.outputs.report-artifact-id }}
          COVERAGE_ARTIFACT: ${{ steps.test.outputs.coverage-artifact-id }}
          TEST_OUTCOME: ${{ steps.failed-test.outcome }}
        with:
          script: |
            const assert = require('node:assert/strict');
            assert.equal(process.env.TEST_OUTCOME, 'failure');
            assert.ok(process.env.SUCCESS_ARTIFACT, 'Successful tests retain reports');
            assert.ok(process.env.FAILURE_ARTIFACT, 'Failed tests retain reports');
            assert.notEqual(process.env.SUCCESS_ARTIFACT, process.env.FAILURE_ARTIFACT);
            assert.ok(process.env.COVERAGE_ARTIFACT, 'Native coverage is retained separately');
            assert.notEqual(process.env.SUCCESS_ARTIFACT, process.env.COVERAGE_ARTIFACT);
  verify:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          artifact-ids: ${{ needs.test.outputs.artifact-id }}
          path: ${{ runner.temp }}/failed-reports
      - name: Verify retained failure report
        shell: bash
        env:
          REPORT_DIRECTORY: ${{ runner.temp }}/failed-reports
        run: |
          test -f "$REPORT_DIRECTORY/junit.xml"
          grep -q 'message="expected"' "$REPORT_DIRECTORY/junit.xml"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          artifact-ids: ${{ needs.test.outputs.success-artifact-id }}
          path: ${{ runner.temp }}/successful-reports
      - name: Verify consolidated reports parse every retained file
        uses: hoverkraft-tech/ci-github-common/actions/quality/parse-ci-reports@33462c06bcbbd9144d7f661929e61953604b444d # 4.3.2
        with:
          working-directory: ${{ runner.temp }}/successful-reports
          report-paths: "**/*"
          output-format: summary
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          artifact-ids: ${{ needs.test.outputs.coverage-artifact-id }}
          path: ${{ runner.temp }}/native-coverage
      - name: Verify native coverage stays available outside consolidated artifacts
        shell: bash
        env:
          REPORT_DIRECTORY: ${{ runner.temp }}/successful-reports
          COVERAGE_DIRECTORY: ${{ runner.temp }}/native-coverage
        run: |
          test ! -e "$REPORT_DIRECTORY/coverage.out"
          grep -q '^mode: atomic$' "$COVERAGE_DIRECTORY/coverage.out"
