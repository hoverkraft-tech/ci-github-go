---
name: Internal - Test lint action
"on":
  workflow_call: null
permissions: {}
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.failed-lint.outputs.report-artifact-id }}
    steps:
      - name: Arrange - Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Assert - Action contract tests pass
        uses: hoverkraft-tech/ci-github-nodejs/actions/test@98d91b1cc347efc64cd5fb20bc0ebc076acad114 # 3.1.0
        with:
          command: test:ci
          arguments: '["actions/lint/action.test.cjs"]'
          coverage: ""
          comment: "false"
      - name: Arrange - Install the project runtime and dependencies
        uses: $/actions/setup-go
        with:
          working-directory: tests/go-project
      - name: Act - Run the default lint checks
        uses: $/actions/lint
        with:
          working-directory: tests/go-project
      - name: Act - Retain diagnostics from a failing command
        uses: $/actions/lint
        with:
          working-directory: tests/go-project
          command: |
            printf '%s\n' '<checkstyle version="4.3"><file name="fixture"><error line="1" severity="error" message="expected lint failure" source="fixture"/></file></checkstyle>' > checkstyle.xml
            exit 23
        id: failed-lint
        continue-on-error: true
      - name: Assert - Failure propagates and reports survive
        shell: bash
        run: |
          test "$OUTCOME" = failure
          test -n "$ARTIFACT"
        env:
          OUTCOME: ${{ steps.failed-lint.outcome }}
          ARTIFACT: ${{ steps.failed-lint.outputs.report-artifact-id }}
  verify:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Arrange - Wait for artifact registration
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ARTIFACT_ID: ${{ needs.lint.outputs.artifact-id }}
        with:
          script: |
            const artifactId = Number(process.env.ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) {
              throw new Error('Upload did not return a valid artifact ID');
            }
            // Upload completion can precede registration in the artifact API.
            for (let attempt = 1; attempt <= 10; attempt += 1) {
              try {
                const { data } = await github.rest.actions.getArtifact({
                  ...context.repo,
                  artifact_id: artifactId,
                });
                if (!data.expired) return;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              await new Promise(resolve => setTimeout(resolve, attempt * 500));
            }
            throw new Error(`Artifact ${artifactId} was not registered`);
      - name: Assert - Download retained lint reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          artifact-ids: ${{ needs.lint.outputs.artifact-id }}
          path: ${{ runner.temp }}/lint-reports
      - name: Assert - Retained report contains the diagnostic
        shell: bash
        run: |
          test -f "$REPORT_DIRECTORY/checkstyle.xml"
          grep -q 'message="expected lint failure"' "$REPORT_DIRECTORY/checkstyle.xml"
        env:
          REPORT_DIRECTORY: ${{ runner.temp }}/lint-reports
