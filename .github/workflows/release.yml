# Publish the exact Go archives retained by continuous-integration.yml after successful validation.
#
# Call prepare-package-release.yml first. Continue only when its status is ready.
# Enable packaging in continuous-integration.yml with the prepared tag, then pass
# package-artifact-id and that tag here. Use the same release-config throughout.
# Preparation handles no-change runs and already-published releases. A manual tag
# retry verifies the existing tag before packaging. Source tags are never overwritten.
#
# Publication verifies the artifact run, commit, tag and availability before creating
# a release. It does not rebuild. Grant actions read, contents write and pull-requests
# read to the calling job, and require successful validation through needs.
# Pull request publication is rejected. Optional environment protection applies to
# publication. No repository bot credentials are needed.
#
# changelog-summary accepts the complete ci-github-publish JSON configuration;
# use the secret for credentials. Empty disables summarization. Publication-only
# reruns reuse the same artifact ID; expired or deleted artifacts fail. A full rerun
# produces a new ID. The shared release action owns release notes and asset recovery.
---
name: Publish Go release
"on":
  workflow_call:
    inputs:
      tag:
        description: Prepared semantic-version tag used for packaging.
        type: string
        required: true
      artifact-id:
        description: Immutable package-artifact-id from continuous-integration.yml in this run and commit. The caller must require successful validation.
        type: string
        required: true
      working-directory:
        description: Project directory matching preparation and packaging.
        type: string
        default: .
      release-config:
        description: Partial YAML or JSON release configuration forwarded unchanged to ci-github-publish/actions/release/create. Use the same configuration when planning.
        type: string
        default: ""
      changelog-summary:
        description: Optional complete JSON summary configuration. Use the secret when it contains credentials; a nonempty secret overrides this input.
        type: string
        default: ""
      environment:
        description: Optional GitHub environment protecting publication.
        type: string
        default: ""
    secrets:
      changelog-summary:
        description: Optional complete JSON summary configuration including credentials. Overrides the input.
        required: false
permissions: {}
concurrency:
  group: go-release-${{ github.repository }}-${{ inputs.working-directory }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Verify release artifact provenance
        id: verify
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAG: ${{ inputs.tag }}
          ARTIFACT_ID: ${{ inputs.artifact-id }}
        with:
          # Retry delayed artifact metadata visibility; authentication failures stay fatal.
          retries: 4
          retry-exempt-status-codes: 400,401,403,422
          script: |
            const tag = process.env.TAG;
            const id = Number(process.env.ARTIFACT_ID);
            if (!/^v?\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(tag)) {
              throw new Error('tag must be a semantic version, optionally prefixed with v.');
            }
            if (!/^[1-9]\d*$/.test(process.env.ARTIFACT_ID) || !Number.isSafeInteger(id)) {
              throw new Error('artifact-id must be one positive integer.');
            }
            if (context.eventName.startsWith('pull_request')) throw new Error('Pull request events cannot publish releases.');
            const { data: artifact } = await github.rest.actions.getArtifact({...context.repo, artifact_id: id});
            if (artifact.expired || artifact.workflow_run?.id !== context.runId || artifact.workflow_run?.head_sha !== context.sha ||
                !artifact.name.startsWith(`go-release-${tag}-${context.runId}-`)) {
              throw new Error('Expected an available release artifact for this run, commit and tag.');
            }
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    permissions:
      actions: read
      contents: write
      pull-requests: read
    steps:
      - name: Publish retained archives and release notes
        uses: hoverkraft-tech/ci-github-publish/actions/release/create@bf24f894f60a3def62a8750f3964d05acb052c11 # 3.1.2
        with:
          config-overrides: ${{ inputs.release-config }}
          release-artifact-id: ${{ inputs.artifact-id }}
          tag: ${{ inputs.tag }}
          target-ref: ${{ github.sha }}
          working-directory: ${{ inputs.working-directory }}
          changelog-summary: ${{ secrets.changelog-summary || inputs.changelog-summary }}
