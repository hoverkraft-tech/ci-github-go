# Package Go binaries with the caller's GoReleaser v2 configuration, without publishing.
#
# Call after the project's required checks. Empty tag builds snapshot archives for CI;
# a planned semantic-version tag builds release archives at the current caller commit.
# Existing tags must resolve to that commit. Only a local tag is created, using read
# permissions. Source tags, releases and registries are never written by this workflow.
#
# Keep platform targets, archives and checksums in the project's .goreleaser.yml.
# artifact-paths selects the exact files handed to release.yml; include the checksums.
# Paths are relative to working-directory. Custom paths are trusted caller configuration.
# The immutable artifact ID belongs to this run and commit, is bound to the planned
# tag, and is retained seven days. A failed build returns no successful artifact ID.
# Snapshot artifacts cannot be published through release.yml.
#
# Use the same working-directory in preparation, validation and publication. See
# [release](release.md) for the artifact handoff. Pin callers to a reviewed commit SHA.
---
name: Build Go release archives
"on":
  workflow_call:
    inputs:
      working-directory:
        description: Go project containing the GoReleaser v2 configuration.
        type: string
        default: .
      go-version:
        description: Go version for packaging; empty uses project detection.
        type: string
        default: ""
      tag:
        description: Planned semantic-version tag, optionally prefixed with v. Empty builds snapshots.
        type: string
        default: ""
      goreleaser-version:
        description: GoReleaser v2 version constraint.
        type: string
        default: "~> v2"
      artifact-paths:
        description: Files to retain relative to working-directory, one glob per line. Include release archives and checksums only.
        type: string
        default: |
          dist/*.tar.gz
          dist/*.zip
          dist/checksums.txt
    outputs:
      artifact-id:
        description: Immutable artifact ID of the packaged archives and checksums in this run.
        value: ${{ jobs.build.outputs.artifact-id }}
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ job.status == 'success' && steps.upload.outputs.artifact-id || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: $/actions/setup-go
        with:
          working-directory: ${{ inputs.working-directory }}
          go-version: ${{ inputs.go-version }}
      - name: Set planned version locally
        id: tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then exit 0; fi
          if ! [[ "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo 'tag must be a semantic version, optionally prefixed with v.' >&2
            exit 1
          fi
          if commit=$(git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG^{commit}"); then
            test "$commit" = "$GITHUB_SHA" || { echo 'Tag belongs to a different commit.' >&2; exit 1; }
          else
            git -c tag.gpgSign=false tag -- "$RELEASE_TAG" "$GITHUB_SHA"
          fi
      - name: Package without publication
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ inputs.goreleaser-version }}
          workdir: ${{ inputs.working-directory }}
          args: release --clean --skip=publish ${{ inputs.tag == '' && '--snapshot' || '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - id: artifact
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DIRECTORY: ${{ inputs.working-directory }}
          PATHS: ${{ inputs.artifact-paths }}
          TAG: ${{ inputs.tag }}
        with:
          script: |
            const path = require('node:path');
            const files = process.env.PATHS.split(/\r?\n/).map(value => value.trim()).filter(Boolean);
            if (!files.length) throw new Error('artifact-paths must contain at least one path.');
            const root = path.resolve(process.env.GITHUB_WORKSPACE);
            const directory = path.resolve(root, process.env.DIRECTORY);
            const resolved = files.map(file => path.resolve(directory, file));
            if (resolved.some(file => !file.startsWith(directory + path.sep))) {
              throw new Error('artifact-paths must stay inside working-directory.');
            }
            core.setOutput('paths', resolved.join('\n'));
            core.setOutput('name', `go-release-${process.env.TAG || 'snapshot'}-${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}-${require('node:crypto').randomUUID()}`);
      - name: Retain packaged archives
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.artifact.outputs.paths }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
