name: Internal - Test continuous integration workflow
"on":
  workflow_call: null
permissions: {}
jobs:
  configuration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert - Workflow configuration tests pass
        uses: hoverkraft-tech/ci-github-nodejs/actions/test@191d7230d57982bfc11d57f68b005f386a6d7fbf # 3.1.1
        with:
          command: test:ci
          arguments: '["tests/config.test.cjs"]'
          coverage: none
          comment: "false"
  fixture:
    uses: $/.github/workflows/continuous-integration.yml
    permissions:
      contents: read
      id-token: write
      actions: read
    with:
      working-directory: tests/go-project
      test: '{"coverage":true}'
      go-versions: '["1.26", "1.27"]'
      dependency-review: false
  checks-disabled:
    uses: $/.github/workflows/continuous-integration.yml
    permissions:
      contents: read
      id-token: write
      actions: read
    with:
      checks: false
      working-directory: must-not-exist
      lint: exit 99
      test: exit 99
