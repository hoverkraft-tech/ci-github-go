# Run opinionated checks with project-owned configuration.
#
# ### Quick start
#
# ```yaml
# name: CI
# on: [push, pull_request]
# permissions: {}
# jobs:
#   go:
#     uses: hoverkraft-tech/ci-github-go/.github/workflows/continuous-integration.yml@main
#     permissions:
#       contents: read
#       id-token: write
#     with:
#       working-directory: .
#       go-versions: '["1.26", "1.27"]'
# ```
#
# An empty versions input uses project detection once. The last matrix entry is
# the primary version: lint, audit and build checks run there, and only
# that version publishes coverage. Tests run on every entry with fail-fast disabled.
# Duplicate, malformed and non-string versions are rejected. `runs-on` is a JSON
# array of Linux labels and applies to every job, including configuration.
#
# `checks: false` disables every check. Set `lint` or `test` to the string
# `"false"`, `"null"` or an empty string to disable that check. A command string or
# JSON object with `command` replaces its default. Commands are trusted Bash
# programs and run unchanged with failure propagation; do not populate them from
# untrusted pull request text. Unknown options fail before any project execution.
#
# Dependency review runs only on pull requests. Disable it with
# `dependency-review: false` when unavailable for the caller repository.
# `audit: false` disables vulnerability scanning. Audit results depend on the
# current vulnerability database and require network access.
#
# ### Go projects
#
# Each job targets one module. The setup action uses `go.mod` (including a
# `toolchain` directive) unless `go-version` is supplied. Pin a supported
# toolchain in the project. Explicit matrix versions should use major/minor
# strings to receive their latest patch releases.
#
# Setup downloads and verifies modules and runs `go mod tidy -diff` without
# repairing metadata. `GOWORK=off` isolates the module, and `GOTOOLCHAIN=local`
# prevents a matrix entry silently switching compilers. Use a caller matrix
# over `working-directory` for repositories containing several modules.
#
# Default lint checks gofmt, module tidiness and golangci-lint v2. Put project
# rules in `.golangci.yml`; the default is the standard linter set. The
# pinned linter must support the chosen Go version. Tests use gotestsum with
# `-race`, `-count=1`, a five-minute package timeout and atomic coverage.
# Set `test: '{"race":false}'` when the runner cannot use the race detector.
# Audit uses the official govulncheck, including standard-library advisories.
#
# Build checks all packages by default. To retain a binary:
#
# ```yaml
# with:
#   build: '{"command":"go build -mod=readonly -trimpath -o dist/server ./cmd/server","artifact":"dist"}'
# ```
#
# `build-artifact-id` identifies that upload. Artifact paths are directories
# inside the checkout. Each invocation uses a unique artifact name.
# Build output is not published as a release.
#
# ### Reports and permissions
#
# Tests retain JUnit and supported coverage files for seven days, including after
# command failures. Lint retains parsed SARIF/Checkstyle reports. Only report files
# are uploaded, with unique names for parallel calls; a job producing no reports
# returns an empty `report-artifact-id`. Summaries and annotations work without PR
# write permissions. Individual PR comments are not created.
#
# Use the common
# [ci-reports workflow](https://github.com/hoverkraft-tech/ci-github-common/blob/main/.github/workflows/ci-reports.yml)
# for consolidated comments after standalone producer jobs; set `report-group` to
# the outer calling job ID when required. Go coverage uses native `go tool cover` summaries and retains
# `coverage.out`; the common parser handles JUnit, not native Go coverage.
#
# `test: '{"coverage":"codecov"}'` enables OIDC upload. The expected coverage file is
# `coverage.out`. A custom command must produce
# the applicable file. `coverage` controls publication, not collection, and an
# empty value still retains JUnit results. The reusable workflow declares
# `id-token: write` for Codecov and callers must grant it, including for default
# GitHub reports. Standalone GitHub reporting requires only read permissions.
# No repository-specific bot secrets are required by the public actions or workflow.
#
# See [setup-go](../../actions/setup-go/README.md), [lint](../../actions/lint/README.md),
# [test](../../actions/test/README.md) and [audit](../../actions/audit/README.md)
# for standalone action usage. Pin the workflow to a reviewed commit SHA in production.

---
name: Go Continuous Integration
"on":
  workflow_call:
    inputs:
      runs-on:
        description: JSON array of Linux runner labels for all jobs.
        type: string
        default: '["ubuntu-latest"]'
      checks:
        description: Enable all checks, including build.
        type: boolean
        default: true
      working-directory:
        description: One project directory inside the checkout. Use a caller matrix for multiple projects.
        type: string
        default: .
      go-versions:
        description: JSON array of Go versions. The last entry runs lint, audit and build and publishes coverage. Empty runs project detection once. An empty entry uses the project version.
        type: string
        default: ""
      lint:
        description: true for default checks, a trusted Bash command, or a JSON object with command. false, null or empty disables lint.
        type: string
        default: "true"
      test:
        description: true for default tests, a trusted Bash command, or a JSON object with command, coverage (`github`, `codecov` or empty), and race (boolean). false, null or empty disables tests. Coverage publication runs only on the last version; the command controls collection.
        type: string
        default: "true"
      audit:
        description: Check production dependencies for known vulnerabilities.
        type: boolean
        default: true
      dependency-review:
        description: Review dependency changes on pull requests. Requires GitHub dependency review availability.
        type: boolean
        default: true
      build:
        description: true for go build, a trusted Bash command, or a JSON object with command and artifact (one project-relative directory). false, null or empty disables build.
        type: string
        default: "true"
      golangci-lint-version:
        description: Pinned golangci-lint v2 release used by the lint action.
        type: string
        default: v2.15.0
    outputs:
      build-artifact-id:
        description: Build artifact ID when build.artifact is configured.
        value: ${{ jobs.build.outputs.artifact-id }}
permissions: {}
jobs:
  configuration:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions: {}
    outputs:
      versions: ${{ steps.config.outputs.versions }}
      primary-version: ${{ steps.config.outputs.primary-version }}
      lint: ${{ steps.config.outputs.lint }}
      test: ${{ steps.config.outputs.test }}
      build: ${{ steps.config.outputs.build }}
    steps:
      - id: config
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          VERSIONS: ${{ inputs.go-versions }}
          LINT: ${{ inputs.lint }}
          TEST: ${{ inputs.test }}
          BUILD: ${{ inputs.build }}
        with:
          script: |
            const versions = process.env.VERSIONS.trim() ? JSON.parse(process.env.VERSIONS) : [''];
            if (!Array.isArray(versions) || !versions.length || versions.length > 20 ||
                versions.some(version => typeof version !== 'string' || (version && !/^\d+\.\d+(?:\.\d+)?$/.test(version))) ||
                new Set(versions).size !== versions.length) {
              throw new Error('versions must be a nonempty JSON array of unique numeric version strings.');
            }
            function options(name, input, defaults) {
              const value = input.trim();
              if (['', 'false', 'null'].includes(value)) return null;
              let config;
              if (value === 'true') config = {};
              else if (value.startsWith('{') || value.startsWith('[')) config = JSON.parse(value);
              else config = {command: value};
              if (!config || typeof config !== 'object' || Array.isArray(config)) throw new Error(name + ' must be a command or JSON object.');
              const unknown = Object.keys(config).filter(key => !Object.hasOwn(defaults, key));
              if (unknown.length) throw new Error('Unknown ' + name + ' options: ' + unknown.join(', '));
              config = {...defaults, ...config};
              for (const [key, value] of Object.entries(config)) {
                if (typeof value !== typeof defaults[key]) throw new Error(name + '.' + key + ' has the wrong type.');
              }
              return config;
            }
            const lint = options('lint', process.env.LINT, {command: ''});
            const test = options('test', process.env.TEST, {"command": "", "coverage": "github", "race": true});
            if (test && !['', 'github', 'codecov'].includes(test.coverage)) throw new Error('test.coverage must be github, codecov or empty.');
            const build = options('build', process.env.BUILD, {command: 'go build -mod=readonly -trimpath ./...', artifact: ''});
            const artifact = build?.artifact;
            if (artifact && (artifact === '.' || artifact.startsWith('/') || artifact.includes('\\') || artifact.split('/').includes('..') || /[\r\n*?]/.test(artifact))) {
              throw new Error('build.artifact must be one directory inside working-directory.');
            }
            if (build && !build.command.trim()) throw new Error('build.command must not be empty.');
            core.setOutput('build', JSON.stringify(build));
            core.setOutput('versions', versions);
            core.setOutput('primary-version', versions.at(-1));
            core.setOutput('lint', JSON.stringify(lint));
            core.setOutput('test', JSON.stringify(test));
  dependency-review:
    if: inputs.checks && inputs.dependency-review && github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec
  lint:
    if: inputs.checks && needs.configuration.outputs.lint != 'null'
    needs: configuration
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - *checkout
      - &setup-primary
        uses: $/actions/setup-go
        with:
          working-directory: ${{ inputs.working-directory }}
          go-version: ${{ needs.configuration.outputs.primary-version }}
      - uses: $/actions/lint
        with:
          working-directory: ${{ inputs.working-directory }}
          command: ${{ fromJSON(needs.configuration.outputs.lint).command }}
          golangci-lint-version: ${{ inputs.golangci-lint-version }}
  test:
    if: inputs.checks && needs.configuration.outputs.test != 'null'
    needs: configuration
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - *checkout
      - uses: $/actions/setup-go
        with:
          working-directory: ${{ inputs.working-directory }}
          go-version: ${{ matrix.version }}
      - uses: $/actions/test
        with:
          working-directory: ${{ inputs.working-directory }}
          command: ${{ fromJSON(needs.configuration.outputs.test).command }}
          coverage: ${{ matrix.version == needs.configuration.outputs.primary-version && fromJSON(needs.configuration.outputs.test).coverage || '' }}
          race: ${{ fromJSON(needs.configuration.outputs.test).race }}
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.configuration.outputs.versions) }}
  audit:
    if: inputs.checks && inputs.audit
    needs: configuration
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - *checkout
      - *setup-primary
      - uses: $/actions/audit
        with:
          working-directory: ${{ inputs.working-directory }}
  build:
    if: inputs.checks && needs.configuration.outputs.build != 'null'
    needs: configuration
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - *checkout
      - *setup-primary
      - uses: $/actions/build
        with:
          working-directory: ${{ inputs.working-directory }}
          command: ${{ fromJSON(needs.configuration.outputs.build).command }}
      - id: artifact
        if: fromJSON(needs.configuration.outputs.build).artifact != ''
        uses: hoverkraft-tech/ci-github-common/actions/working-directory@66882b24f9f13e45a6541896a5a7c638cb91c94c
        with:
          working-directory: ${{ inputs.working-directory }}/${{ fromJSON(needs.configuration.outputs.build).artifact }}
      - id: artifact-name
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        if: fromJSON(needs.configuration.outputs.build).artifact != ''
        with:
          script: |
            core.setOutput('name', 'go-build-' + require('node:crypto').randomUUID());
      - id: upload-build
        if: fromJSON(needs.configuration.outputs.build).artifact != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: ${{ steps.artifact.outputs.absolute-path }}
          if-no-files-found: error
          retention-days: 7
    outputs:
      artifact-id: ${{ steps.upload-build.outputs.artifact-id }}
